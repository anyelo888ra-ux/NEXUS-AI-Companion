name: Build NEXUS AI Companion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fabric-prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric prototype
        run: gradle --no-daemon build
      - name: Upload Fabric JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-companion-fabric-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  build-forge-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Forge 1.21.11 mod
        working-directory: forge
        run: gradle --no-daemon build
      - name: Upload Forge JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-companion-forge-1.21.11
          path: forge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
